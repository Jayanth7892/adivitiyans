name: Automatic AWS Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  deploy:
    name: Build & Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate GitHub Secrets
        run: |
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "==============================================================================================="
            echo "❌ CRITICAL ERROR: AWS Secrets are missing in your GitHub Repository settings!"
            echo "   Please add AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY under:"
            echo "   GitHub Repo -> Settings -> Secrets and variables -> Actions -> Repository secrets"
            echo "==============================================================================================="
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Make deploy script executable
        run: chmod +x deploy.sh

      - name: Run AWS Deployment Script
        run: ./deploy.sh
